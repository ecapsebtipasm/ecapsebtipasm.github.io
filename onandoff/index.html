<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mouse Split</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ddd;
    }
  </style>
</head>

<body>

  <!-- p5.js library -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>

  <script>
    function setup() {
      createCanvas(windowWidth, windowHeight);
    }

    function draw() {
      background(220);

      if (mouseY < height / 2) {
        fill(255, 0, 0);
        rect(0, 0, width, height);
      } else {
        fill(0, 0, 255);
        rect(0, 0, width, height);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>

</body>
</html>
