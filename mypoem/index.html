<body>
  <h1>呢喃</h1>

  <p>—— “No Place for Self-Pity, No Room for Fear.”



    下个月，
        大风和冷气将要冰封整片大陆，
        不留一丝安全的记忆。
        届时交付一张最后通牒，
        首行写：随我们一起，特殊的五周年纪念日。

    他们从泥沙里
  打捞失去的棕色皮肤，
 现在笑脸捧着向日葵
紧贴着红砖墙；

    幽灵环绕中，
  蓝紫色的温暖身体
     也被称作土地致谢。

    趁风还踌躇着，
        飞到另一边，
    天空，悬置了整年的判断，甚至是
一小块
    拓展了一万公里，才终于到达了海岸线的
                            草地：你辛苦了。
</p>
<p class="ending">
  <span class="emphasis">过去的一切都赶来拥抱我。</span>

  我轻轻地说，
  再也来不及
  把这些叫做呢喃了。
  我们要说出，
  说出至少一句真正的话。
</p>
